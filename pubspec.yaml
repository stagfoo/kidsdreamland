name: kidsdreamland
description: "King Kids Dream Land — trace and colour line art."
publish_to: 'none'
version: 1.0.1+2

environment:
  # Matches the installed Dart (3.13.0), not the conservative version
  # `flutter create` templates in.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Where saved artwork lives. 2.1.6 is current as of 2026-09.
  path_provider: ^2.1.6
  # Saving a finished drawing to the device gallery, so it can be shown
  # to someone or sent on without going through the app. 2.3.3 is current
  # and has no open Android build issues.
  gal: ^2.3.3
  # Short SFX that fire constantly while drawing. Chosen over `soundpool`,
  # whose last release was 2023-08 and which has a history of the AGP
  # namespace build failure; audioplayers is current and has no open Android
  # build regressions.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/sounds/
